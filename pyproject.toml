[project]
name = "dsh-shell"
version = "0.0.1"
description = "Frameless desktop shell for DeepSeek Harness with MCP and skills management"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "loguru>=0.7",
    "PySide6-Essentials>=6.7 ; sys_platform != 'linux'",
    "pywebview[pyside6]>=6.1 ; sys_platform == 'linux'",
    "pywebview>=6.1 ; sys_platform != 'linux'",
    "ruamel-yaml>=0.18",
]

[dependency-groups]
dev = [
    "nuitka>=2.8",
    "pytest>=8.4",
    "pytest-timeout>=2.4",
    "ruff>=0.14",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
timeout = 30
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = [".venv", "dist", "build", "assets"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B", "C4", "UP"]
