name: Build and Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    name: Validate Tag
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Check Tag Matches Version
        id: version
        shell: bash
        run: |
          APP_VERSION="$(python3 -c 'from dsh_shell.version import __version__; print(__version__)')"
          RAW_TAG="${GITHUB_REF_NAME}"
          SEM="${RAW_TAG#v}"
          SEM_NO_BUILD="${SEM%%+*}"

          if [[ "${SEM_NO_BUILD}" != "${APP_VERSION}" ]]; then
            echo "::error::Tag ${RAW_TAG} does not match dsh_shell/version.py ${APP_VERSION}"
            exit 1
          fi

          echo "version=${SEM_NO_BUILD}" >> "${GITHUB_OUTPUT}"
          echo "Building dsh-shell ${SEM_NO_BUILD} from tag ${RAW_TAG}"

  build-linux:
    name: Build Linux DEB
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Setup Python
        run: uv python install 3.12

      - name: Install Python Dependencies
        run: uv sync --group dev --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Run Python Unit Tests
        run: uv run pytest

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            ccache \
            desktop-file-utils \
            patchelf

      - name: Install DeepSeek Harness for Packaged Smoke Test
        run: npm install --global @deepseek-ai/dsh@latest

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ runner.os }}-nuitka
          restore-keys: |
            ${{ runner.os }}-nuitka

      - name: Build Linux Onefile and DEB
        run: ./build_linux.sh

      - name: Verify Release Artifacts
        shell: bash
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          DEB_PATH="dist/dsh-shell_${VERSION}_amd64.deb"

          test -x dist/dsh-shell
          test -f "${DEB_PATH}"
          ./dist/dsh-shell --version
          dpkg-deb --info "${DEB_PATH}"
          dpkg-deb --contents "${DEB_PATH}" > /dev/null
          sha256sum dist/dsh-shell "${DEB_PATH}"

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: linux
          path: |
            dist/dsh-shell
            dist/dsh-shell_*_amd64.deb
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Build Windows EXE
    needs: validate
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Setup Python
        run: uv python install 3.12

      - name: Install Python Dependencies
        run: uv sync --group dev --frozen

      - name: Build Windows Onefile EXE
        run: cmd /c build_windows.bat

      - name: Verify Release Artifact
        shell: pwsh
        run: |
          if (-not (Test-Path dist\dsh-shell.exe -PathType Leaf)) {
            throw "Nuitka did not produce dist\dsh-shell.exe"
          }
          dist\dsh-shell.exe --version
          Get-FileHash dist\dsh-shell.exe -Algorithm SHA256

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v6
        with:
          name: windows
          path: dist/dsh-shell.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish Release
    needs:
      - validate
      - build-linux
      - build-windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v7
        with:
          name: linux
          path: dist

      - name: Download Windows Artifact
        uses: actions/download-artifact@v7
        with:
          name: windows
          path: dist

      - name: Verify Release Assets
        shell: bash
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          DEB_PATH="dist/dsh-shell_${VERSION}_amd64.deb"

          test -f dist/dsh-shell
          chmod +x dist/dsh-shell
          test -f dist/dsh-shell.exe
          test -f "${DEB_PATH}"
          sha256sum dist/dsh-shell dist/dsh-shell.exe "${DEB_PATH}"

      - name: Create Release and Upload
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/dsh-shell
            dist/dsh-shell.exe
            dist/dsh-shell_*_amd64.deb
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
